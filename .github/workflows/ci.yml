name: CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint / typecheck / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Non-blocking: the repo does not currently lint clean, and the ESLint 9/10
      # flat-config migration that would fix it is blocked (the @antfu/eslint-config
      # v9 dependency tree trips the registry's trust-downgrade policy).
      # Make this a required step again once that lands.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test codemod
        run: pnpm test:codemod

  test:
    name: cypress component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome
          working-directory: packages/vue-final-modal

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: packages/vue-final-modal/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
